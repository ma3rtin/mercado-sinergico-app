<app-catalogo-wrapper [titulo]="'Tus pedidos'"
  [subtitulo]="'Administrá tus pedidos y gestioná tus productos reservados'">

  <app-delayed-skeleton [isLoading]="isLoading()" [delay]="200">
    <!-- 🦴 SKELETON -->
    <div skeleton class="flex flex-col gap-6 w-full pt-6">
      @for (i of [1,2,3]; track i) {
      <div
        class="w-full bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex gap-4 items-center animate-pulse">
        <div class="w-20 h-20 flex-shrink-0 rounded-lg bg-gray-200"></div>
        <div class="flex-1 min-w-0 flex flex-col gap-3">
          <div class="flex justify-between items-start">
            <div class="flex flex-col gap-2 w-1/2">
              <div class="h-3 bg-gray-200 rounded w-1/3"></div>
              <div class="h-5 bg-gray-200 rounded w-full"></div>
            </div>
            <div class="w-5 h-5 bg-gray-200 rounded"></div>
          </div>
          <div class="flex flex-col gap-2 mt-1">
            <div class="w-1/2 h-3 bg-gray-200 rounded"></div>
          </div>
          <div class="mt-2 w-full bg-gray-200 rounded-full h-2"></div>
          <div class="flex justify-between items-center text-xs">
            <div class="h-3 bg-gray-200 rounded w-1/4"></div>
            <div class="h-3 bg-gray-200 rounded w-8"></div>
          </div>
        </div>
      </div>
      }
    </div>

    <!-- ❌ Error -->
    @if (errorMessage()) {
    <app-error-state [titulo]="'Error al cargar tus pedidos'" [mensaje]="errorMessage()" (reintentar)="cargarPedidos()">
    </app-error-state>
    }

    <!-- ✅ Lista -->
    @else {
    <!-- 🔍 Filtros y Búsqueda -->
    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <!-- Búsqueda por texto -->
      <div class="flex-1 relative">
        <input type="text" [ngModel]="terminoBusqueda()" (ngModelChange)="terminoBusqueda.set($event)"
          placeholder="Buscar por paquete o ID..."
          class="w-full px-4 py-2.5 pl-11 pr-4 border border-gray-300 rounded-lg text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
        <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>

      <!-- Filtro por Estado -->
      <div class="w-full md:w-64">
        <select [ngModel]="estadoFiltro()" (ngModelChange)="estadoFiltro.set($event)"
          class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors appearance-none cursor-pointer"
          style="background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%236B7280%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 1rem top 50%; background-size: 0.65rem auto;">
          <option value="Todos">Todos los estados</option>
          <option value="Pendiente">Pendiente</option>
          <option value="En Preparación">En Preparación</option>
          <option value="Enviado">Enviado</option>
          <option value="Entregado">Entregado</option>
          <option value="Cancelado">Cancelado</option>
        </select>
      </div>
    </div>

    <!-- GRID -->
    <div class="flex flex-col gap-6">

      @for (pedido of pedidosFiltrados(); track pedido.id_pedido) {
      <app-paquete-usuario-card [pedido]="pedido" (toggleExpansion)="toggleExpansion(pedido)"
        (aumentarCantidad)="aumentarCantidad(pedido, $event)" (disminuirCantidad)="disminuirCantidad(pedido, $event)"
        (eliminarProducto)="eliminarProducto(pedido, $event)" (salirDelPaquete)="salirDelPaquete(pedido)"
        (finalizarCompra)="finalizarCompra(pedido)" (imageError)="onImageError($event)">
      </app-paquete-usuario-card>
      }

      @empty {
      <div class="bg-white rounded-xl shadow-md p-12 text-center mt-4">
        <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4">
            </path>
          </svg>
        </div>
        <h3 class="text-xl font-semibold text-gray-900 mb-2">
          No se encontraron pedidos
        </h3>
        <p class="text-gray-600 mb-6">
          Probá otra búsqueda o revisá más tarde
        </p>
      </div>
      }

    </div>
    }
  </app-delayed-skeleton>

</app-catalogo-wrapper>
