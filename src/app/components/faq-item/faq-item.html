<details class="group bg-white border border-gray-100 rounded-2xl transition-all duration-300 hover:border-brand-primary/30 hover:shadow-md overflow-hidden">
    <summary
        class="font-display text-gray-900 text-sm md:text-base flex items-center justify-between p-5 md:p-6 cursor-pointer list-none select-none [&::-webkit-details-marker]:hidden bg-white group-open:bg-gray-50/50 transition-colors">
        <span class="font-bold pr-4">{{ pregunta() }}</span>
        <div class="p-1 px-2 rounded-lg bg-gray-50 group-hover:bg-brand-primary/10 transition-colors">
            <app-icon name="ChevronDown" size="16" class="text-gray-400 group-hover:text-brand-primary transition-all duration-300 group-open:rotate-180"></app-icon>
        </div>
    </summary>
    <div class="text-gray-600 px-6 pb-6 pt-2 font-body text-sm leading-relaxed animate-fade-in">
        <div class="h-px bg-gray-100 w-full mb-4"></div>
        <ng-content></ng-content>
    </div>
</details>
