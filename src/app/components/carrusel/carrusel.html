<!-- carrusel.html - VERSIÓN CORREGIDA DESKTOP & MOBILE -->
<div class="relative w-full group">

  <!-- Flechas (Solo desktop) - Posicionadas para no ser recortadas -->
  <button
    (click)="scrollLeft()"
    [disabled]="translateX === 0"
    class="hidden md:flex absolute -left-2 lg:-left-10 top-1/2 -translate-y-1/2 z-30 p-3 rounded-full bg-white shadow-xl hover:shadow-2xl
           transition-all duration-200 disabled:opacity-0 disabled:pointer-events-none
           hover:bg-gray-50 border border-gray-100"
    aria-label="Anterior"
  >
    <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
    </svg>
  </button>

  <!-- Contenedor Principal Adaptativo -->
  <div class="w-full overflow-x-auto md:overflow-hidden snap-x snap-mandatory scrollbar-hide py-6 px-1">
    <div
      #carousel
      class="flex gap-4 md:gap-4 transition-transform duration-500 ease-out"
      [style.transform]="'translateX(' + translateX + 'px)'"
    >
      <!-- Cards: Ancho FIJO de 320px para coincidir con la lógica del TS -->
      @for (item of items(); track item.id_paquete_publicado) {
        <div class="flex-shrink-0 snap-center first:ml-4 last:mr-4" [style.width.px]="320">
          <app-paquete-card
            [paquete]="item"
            (cardClick)="onPaqueteClick(item)"
          ></app-paquete-card>
        </div>
      }
    </div>
  </div>

  <!-- Flecha derecha (Solo desktop) -->
  <button
    (click)="scrollRight()"
    [disabled]="translateX === maxScroll"
    class="hidden md:flex absolute -right-2 lg:-right-10 top-1/2 -translate-y-1/2 z-30 p-3 rounded-full bg-white shadow-xl hover:shadow-2xl
          transition-all duration-300 disabled:opacity-0 disabled:pointer-events-none
          hover:bg-gray-50 border border-gray-100"
    aria-label="Siguiente"
  >
    <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
    </svg>
  </button>

  <!-- Indicador de progreso (Móvil) -->
  @if (items().length > 1) {
    <div class="flex md:hidden justify-center gap-2 mt-2">
      @for (item of items(); track $index) {
        <div
          [class.bg-brand-cta]="currentIndex === $index"
          [class.bg-gray-200]="currentIndex !== $index"
          class="w-2.5 h-1.5 rounded-full transition-all duration-300"
        ></div>
      }
    </div>
  }
</div>
