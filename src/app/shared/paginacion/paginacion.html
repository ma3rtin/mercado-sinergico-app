<!-- paginacion.html -->
<!--
  ════════════════════════════════════════════════════════════
  ⚠️ IMPORTANTE: Este componente NO usa el pipe de ngx-pagination

  Usamos paginación manual (slice en el componente padre) porque:
  1. Ya tenemos la lógica de paginación en el TS (productosPaginados, paquetesPaginados)
  2. Solo necesitamos los controles visuales de ngx-pagination
  3. Es más flexible para nuestro caso de uso
  ════════════════════════════════════════════════════════════
-->

@if (shouldShow()) {
  <div class="flex flex-col md:flex-row gap-4 items-center justify-between mt-8 mb-4 px-4">

    <!-- 📊 Información de items mostrados -->
    <div class="flex flex-wrap items-center justify-center md:justify-start gap-2 text-sm text-gray-700 font-body">
      <p>
        Mostrando
        <span class="font-semibold text-secondary-dark">{{ showingFrom() }}</span>
        -
        <span class="font-semibold text-secondary-dark">{{ showingTo() }}</span>
        de
        <span class="font-semibold text-secondary-dark">{{ totalItems() }}</span>
        productos
      </p>

      <!-- Selector de items por página (opcional) -->
      @if (showItemsPerPage()) {
        <div class="flex items-center gap-2 ml-0 md:ml-4">
          <label for="items-per-page" class="text-sm text-gray-700 whitespace-nowrap">
            Mostrar:
          </label>
          <select
            id="items-per-page"
            [value]="itemsPerPage()"
            (change)="onItemsPerPageChanged($event)"
            class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm
                   focus:ring-2  focus:border-primary
                   bg-white cursor-pointer transition-colors
                   hover:border-primary-dark">
            @for (option of itemsPerPageOptions(); track option) {
              <option [value]="option">{{ option }}</option>
            }
          </select>
        </div>
      }
    </div>

    <!-- 🎯 Controles de paginación MANUALES -->
    <div class="w-full md:w-auto">
      <nav class="flex items-center justify-center gap-1 flex-wrap font-body" role="navigation" aria-label="Pagination">

        <!-- Botón Anterior -->
        <button
          type="button"
          [disabled]="currentPage() === 1"
          (click)="onPageChanged(currentPage() - 1)"
          [class]="getButtonClass(false, currentPage() === 1)"
          aria-label="Página anterior">
          {{ previousLabel() }}
        </button>

        <!-- Números de página -->
        @for (page of getPageNumbers(); track page) {
          @if (page === 100) {
            <span class="px-3 py-2 text-gray-500 select-none">...</span>
          } @else {
            <button
              type="button"
              [class]="getButtonClass(page === currentPage(), false)"
              (click)="onPageChanged(page)"
              [attr.aria-label]="'Página ' + page"
              [attr.aria-current]="page === currentPage() ? 'page' : null">
              {{ page }}
            </button>
          }
        }

        <!-- Botón Siguiente -->
        <button
          type="button"
          [disabled]="currentPage() === totalPages()"
          (click)="onPageChanged(currentPage() + 1)"
          [class]="getButtonClass(false, currentPage() === totalPages())"
          aria-label="Página siguiente">
          {{ nextLabel() }}
        </button>

      </nav>
    </div>

  </div>
}

<style>
/* 🎨 Estilos responsive para mobile */
@media (max-width: 640px) {
  button[aria-label="Página anterior"]::before {
    content: '←';
    margin-right: 0;
  }

  button[aria-label="Página siguiente"]::after {
    content: '→';
    margin-left: 0;
  }

  button[aria-label="Página anterior"],
  button[aria-label="Página siguiente"] {
    font-size: 0;
    padding: 0.5rem;
    min-width: 2rem;
  }

  button[aria-label="Página anterior"]::before,
  button[aria-label="Página siguiente"]::after {
    font-size: 1rem;
  }
}

/* ♿ Accesibilidad - Focus visible */
button:focus-visible {
  @apply ring-4  ring-offset-2 outline-none;
}

/* Tamaños mínimos touch (44x44px) */
@media (max-width: 768px) {
  button {
    min-width: 44px;
    min-height: 44px;
    @apply flex items-center justify-center;
  }
}
</style>
