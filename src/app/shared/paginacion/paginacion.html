@if (shouldShow()) {
  <div class="flex justify-center w-full my-8">
    <nav class="inline-flex items-center gap-1 sm:gap-2 font-body" role="navigation" aria-label="Pagination">

      <!-- Botón Anterior -->
      @if (currentPage() > 1) {
        <button
          type="button"
          (click)="onPageChanged(currentPage() - 1)"
          [class]="getNavButtonClass()"
          aria-label="Página anterior">
          <svg class="w-4 h-4 mr-1 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          <span class="hidden sm:inline">Anterior</span>
        </button>
      }

      <!-- Números de página -->
      <div class="flex items-center gap-1 sm:gap-2 mx-2">
        @for (page of getPageNumbers(); track page) {
          @if (page === 100) {
            <span class="px-1 text-gray-500 tracking-widest select-none">...</span>
          } @else {
            <button
              type="button"
              [class]="getNumberButtonClass(page === currentPage())"
              (click)="onPageChanged(page)"
              [attr.aria-label]="'Página ' + page"
              [attr.aria-current]="page === currentPage() ? 'page' : null">
              {{ page }}
            </button>
          }
        }
      </div>

      <!-- Botón Siguiente -->
      @if (currentPage() < totalPages()) {
        <button
          type="button"
          (click)="onPageChanged(currentPage() + 1)"
          [class]="getNavButtonClass()"
          aria-label="Página siguiente">
          <span class="hidden sm:inline">Siguiente</span>
          <svg class="w-4 h-4 ml-1 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      }

    </nav>
  </div>
}
