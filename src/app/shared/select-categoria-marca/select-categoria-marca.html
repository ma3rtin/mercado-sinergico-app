<div
  class="flex flex-col gap-3 rounded-xl border-2 transition-colors"
  [ngClass]="hasError() ? 'border-error' : 'border-transparent'"
>
  @if (label()) {
    <label class="text-lg font-medium text-black">
      {{ label() }} <span class="text-error">*</span>
    </label>
  }

  <!-- Buscador Inline -->
  <div class="relative">
    <app-icon name="search" size="18" class="absolute left-3 top-1/2 -translate-y-1/2 text-text-muted" />
    <input
      type="text"
      [ngModel]="searchTerm()"
      (ngModelChange)="searchTerm.set($event)"
      [placeholder]="searchPlaceholder()"
      class="w-full pl-10 pr-4 py-2.5 bg-bg-app border border-border-default rounded-xl focus:ring-2 focus:ring-brand-primary/20 focus:border-brand-primary outline-none transition-all text-sm placeholder:text-text-muted"
    />
  </div>

  <!-- Grid de Chips/Opciones -->
  <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-2 max-h-48 overflow-y-auto custom-scrollbar p-1">
    @for (option of filteredOptions(); track option.id) {
      <div class="relative group">
        @if (editingId() === option.id) {
          <div class="flex items-center gap-1 p-1 rounded-xl border-2 border-[#71A8D9] bg-[#D9E9F6] shadow-inner">
            <input
              type="text"
              [ngModel]="editingName()"
              (ngModelChange)="editingName.set($event)"
              (keydown)="onEditKeydown($event)"
              class="w-full bg-transparent border-none outline-none text-xs font-bold text-[#2E608C] px-1"
            />
            <button type="button" (click)="confirmEdit($event)" class="text-[#2E608C] hover:scale-110 transition-transform" [disabled]="isEditLoading()">
              @if (isEditLoading()) {
                <app-icon name="loader" size="14" class="animate-spin" />
              } @else {
                <app-icon name="check" size="14" />
              }
            </button>
            <button type="button" (click)="cancelEdit($event)" [disabled]="isEditLoading()" class="text-text-muted hover:text-error transition-colors">
              <app-icon name="x" size="14" />
            </button>
          </div>
        } @else {
          <button
            type="button"
            (click)="select(option.id)"
            (mouseenter)="onButtonEnter(option, btnTrigger)"
            (mouseleave)="onButtonLeave()"
            [disabled]="isDisabled()"
            cdkOverlayOrigin
            #btnTrigger="cdkOverlayOrigin"
            [class]="'w-full relative flex items-center justify-center pl-3 pr-8 py-2.5 rounded-xl border text-xs font-bold transition-all active:scale-95 group/btn ' +
              (selectedValue() === option.id
                ? 'bg-brand-cta text-gray-900 border-brand-cta shadow-sm'
                : 'bg-white text-text-secondary border-border-default hover:border-brand-primary/50 shadow-sm')"
          >
            <span class="truncate">{{ option.nombre }}</span>

            @if (!isDisabled()) {
              <span
                (click)="startEdit(option, $event)"
                class="absolute right-2 top-1/2 -translate-y-1/2 mt-[0.5px] opacity-0 group-hover/btn:opacity-100 p-1 text-text-muted hover:text-brand-secondary transition-all"
              >
                <app-icon name="edit2" size="14" />
              </span>
            }
          </button>
        }
      </div>
    } @empty {
      <div class="col-span-full py-6 text-center bg-bg-app rounded-xl border border-dashed border-border-default">
        <p class="text-xs text-text-muted italic">No se encontraron resultados</p>
      </div>
    }
  </div>

  @if (hoveredOrigin()) {
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="hoveredOrigin()!"
      [cdkConnectedOverlayOpen]="true"
      [cdkConnectedOverlayPositions]="tooltipPositions"
      [cdkConnectedOverlayPush]="true"
      [cdkConnectedOverlayViewportMargin]="8"
      (mouseenter)="onOverlayEnter()"
      (mouseleave)="onOverlayLeave()">
      <div class="px-2 py-1 bg-brand-secondary text-white text-xs rounded-lg shadow-lg whitespace-nowrap max-w-xs">
        {{ hoveredOption()?.nombre }}
      </div>
    </ng-template>
  }

  <!-- Campo de creación rápida -->
  <div class="flex gap-2 pt-2 border-t border-border-default/50">
    <input
      type="text"
      [ngModel]="newName()"
      (ngModelChange)="newName.set($event)"
      (keyup.enter)="handleCreate()"
      [placeholder]="placeholderCreate()"
      [disabled]="loading()"
      class="flex-1 px-4 py-2 bg-bg-raised border border-border-default rounded-xl focus:ring-2 focus:ring-brand-primary/20 focus:border-brand-primary outline-none transition-all text-sm disabled:opacity-50 disabled:cursor-not-allowed"
    />
    <app-button
      variant="primary"
      shape="circle"
      size="sm"
      [iconOnly]="true"
      iconStart="plus"
      class="[&_app-icon]:-translate-y-[2px]"
      [loading]="loading()"
      [disabled]="isDisabled() || !newName().trim()"
      (buttonClick)="handleCreate()"
    />
  </div>
</div>
