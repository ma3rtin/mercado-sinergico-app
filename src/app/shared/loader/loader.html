<div class="flex flex-col items-center justify-center" [ngClass]="padding()">
  <div
    class="animate-spin rounded-full border-b-2 border-b-[var(--brand-primary)] mb-4"
    [class.h-8]="size() === 'sm'"
    [class.w-8]="size() === 'sm'"
    [class.h-12]="size() === 'md'"
    [class.w-12]="size() === 'md'"
    [class.h-16]="size() === 'lg'"
    [class.w-16]="size() === 'lg'"
  ></div>

  @if (mensaje()) {
    <p class="text-text-muted text-sm animate-pulse">{{ mensaje() }}</p>
  }
</div>
