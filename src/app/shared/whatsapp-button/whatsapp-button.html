<!-- 💬 Botón flotante de WhatsApp: Mobile-First adjust -->
<div class="fixed bottom-20 md:bottom-6 right-6 z-40 transition-all duration-300">
    <button (click)="openWhatsApp()"
        class="flex items-center justify-center w-14 h-14 bg-[#25D366] text-white rounded-full shadow-[0_8px_30px_rgba(37,211,102,0.3)] 
               cursor-pointer hover:bg-[#128C7E] hover:scale-110 active:scale-95 transition-all duration-200 ease-in-out"
        aria-label="Contactar por WhatsApp">
        <i class="fab fa-whatsapp text-3xl"></i>
    </button>
</div>
