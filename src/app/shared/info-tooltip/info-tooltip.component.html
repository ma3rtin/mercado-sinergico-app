<div class="tooltip-trigger relative inline-block z-20">
  <div class="w-8 h-8 rounded-full flex items-center justify-center cursor-default
              border-2 shadow-sm bg-white/90 backdrop-blur-sm transition-transform hover:scale-110"
       [ngClass]="iconClass">
    <app-icon [name]="iconName" [size]="iconSize"></app-icon>
  </div>

  <!-- Tooltip Content -->
  <div class="tooltip-content absolute w-48 sm:w-56 bg-gray-900/95 backdrop-blur-md text-white rounded-xl p-3 shadow-xl border border-gray-700 pointer-events-none z-50"
       [ngClass]="getContentPositionClass()">
    @if (title) {
      <strong class="block text-xs sm:text-sm font-bold mb-1 tracking-wide" [ngClass]="titleClass">
        {{ title }}
      </strong>
    }
    <p class="text-[11px] sm:text-xs leading-relaxed text-gray-300">
      {{ description }}
    </p>
  </div>
</div>
